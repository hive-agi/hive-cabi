name: release

# Patch-bump and publish when a push to main changes the library, like the
# rest of the fleet (modeled on hive-spi). Tests run first: a published pom is
# immutable.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
  workflow_dispatch:
    inputs:
      level:
        description: 'Version bump level'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - name: Run tests
        run: clojure -M:test

      - name: Bump version
        run: clojure -T:build bump :level :${{ inputs.level || 'patch' }}

      - name: Commit and tag
        run: |
          VER=$(cat VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          git add VERSION
          git commit -m "chore(release): $VER [skip ci]"
          git tag -a "v$VER" -m "release $VER"
          git push --follow-tags

      - name: Deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
